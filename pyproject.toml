[project]
name = "tg-business-bridge"
version = "0.1.0"
description = "Bridge between Telegram Business API and any AI agent: 24/7 message collector daemon + MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AndyShaman", email = "AndyShaman@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.24",
    "mcp>=1.9",
    "pydantic-settings>=2.4",
]

[project.scripts]
tg-business-bridge-mcp = "tg_business_bridge.mcp_server:main"
tg-business-bridge = "tg_business_bridge.daemon.app:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
