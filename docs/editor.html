<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!-- Страница ничего не отправляет в сеть: запросы скриптов ниже этой строки браузер блокирует.
     Хеш — от встроенного скрипта страницы; после его правки пересчитать (tests/test_editor_page.py) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://telegram.org 'sha256-Ffzx8GJk6T6qo/cKmE4pRICBgHO5tuKxzjTzLdPEdFw='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Редактор черновика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Только цвета темы Telegram — страница не делает ни одного внешнего запроса,
     текст черновика живёт в URL-фрагменте и не покидает устройство */
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    font: 16px/1.45 -apple-system, system-ui, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    padding: 12px;
    gap: 8px;
  }
  #toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
  #toolbar button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--tg-theme-hint-color, #999);
    border-radius: 8px;
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    color: inherit;
  }
  #toolbar button.b { font-weight: 700; }
  #toolbar button.i { font-style: italic; }
  #linkbar { display: none; gap: 6px; }
  #linkbar.on { display: flex; }
  #linkbar input {
    flex: 1;
    font: inherit;
    padding: 6px 10px;
    border: 1px solid var(--tg-theme-hint-color, #999);
    border-radius: 8px;
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    color: inherit;
    outline: none;
  }
  #editor {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    border: 1px solid var(--tg-theme-hint-color, #999);
    border-radius: 10px;
    padding: 10px;
    font: inherit;
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    color: inherit;
    outline: none;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  #editor a { color: var(--tg-theme-link-color, #2481cc); text-decoration: underline; }
  #editor code, #editor pre { font-family: ui-monospace, Menlo, Consolas, monospace; }
  #editor blockquote {
    margin: 4px 0;
    padding-left: 10px;
    border-left: 3px solid var(--tg-theme-hint-color, #999);
  }
  #editor tg-spoiler {
    background: var(--tg-theme-hint-color, #999);
    border-radius: 4px;
  }
  #counter {
    font-size: 13px;
    color: var(--tg-theme-hint-color, #708499);
    text-align: right;
    min-height: 18px;
  }
  #counter.over { color: #e53935; font-weight: 600; }
</style>
</head>
<body>
<div id="toolbar">
  <button type="button" id="bold" class="b">B</button>
  <button type="button" id="italic" class="i">I</button>
  <button type="button" id="link">🔗 Ссылка</button>
  <button type="button" id="clear">✕</button>
</div>
<div id="linkbar">
  <input id="url" type="url" inputmode="url" placeholder="https://… (пусто — убрать ссылку)">
  <button type="button" id="apply">OK</button>
</div>
<div id="editor" contenteditable="true"></div>
<div id="counter"></div>
<script>
(function () {
  var tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  var params = new URLSearchParams(location.hash.slice(1));
  var draftId = params.get("id") || "";
  // Страница раздаётся с общего адреса, к ней ходят и старые демоны: те кладут во
  // фрагмент text= и принимают обратно только поле text — форматирование им незнакомо
  var legacy = params.get("html") === null && params.get("text") !== null;
  var editor = document.getElementById("editor");
  var counter = document.getElementById("counter");
  var linkbar = document.getElementById("linkbar");
  var urlInput = document.getElementById("url");

  // Лимит Telegram на сообщение (по видимому тексту) и на конверт sendData (в байтах)
  var TEXT_LIMIT = 4096;
  var DATA_LIMIT = 4096;
  var enc = new TextEncoder();

  // --- разметка: что мы понимаем на входе и что отдаём на выходе ---
  var KEEP = {
    B: "b", STRONG: "b", I: "i", EM: "i", U: "u", INS: "u",
    S: "s", STRIKE: "s", DEL: "s", CODE: "code", PRE: "pre",
    BLOCKQUOTE: "blockquote", "TG-SPOILER": "tg-spoiler"
  };

  function isSpoiler(el) {
    return /(^|\s)tg-spoiler(\s|$)/.test(el.getAttribute("class") || "");
  }

  function codeLanguage(el) {
    var cls = el.getAttribute("class") || "";
    return /^language-/.test(cls) ? cls : "";
  }

  function allowedUrl(href) {
    return /^(https?:\/\/|tg:\/\/|mailto:)/i.test(href.trim());
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function escAttr(s) {
    return esc(s).replace(/"/g, "&quot;");
  }

  // --- вход: HTML из URL-фрагмента переносится в поле по белому списку ---
  function copyClean(src, out) {
    var nodes = Array.prototype.slice.call(src.childNodes);
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType === 3) {
        // переводы строк из разметки должны стать настоящими <br>
        var parts = n.nodeValue.split("\n");
        for (var j = 0; j < parts.length; j++) {
          if (j) out.appendChild(document.createElement("br"));
          if (parts[j]) out.appendChild(document.createTextNode(parts[j]));
        }
        continue;
      }
      if (n.nodeType !== 1) continue;
      var tag = n.tagName;
      if (tag === "BR") {
        out.appendChild(document.createElement("br"));
        continue;
      }
      if (tag === "A") {
        var href = n.getAttribute("href") || "";
        if (allowedUrl(href)) {
          var a = document.createElement("a");
          a.setAttribute("href", href.trim());
          copyClean(n, a);
          out.appendChild(a);
          continue;
        }
        copyClean(n, out); // ссылка с чужим протоколом разворачивается в свой текст
        continue;
      }
      if (tag === "SPAN" && isSpoiler(n)) {
        var spoiler = document.createElement("tg-spoiler");
        copyClean(n, spoiler);
        out.appendChild(spoiler);
        continue;
      }
      var keep = KEEP[tag];
      if (keep) {
        var el = document.createElement(keep);
        if (tag === "CODE" && codeLanguage(n)) el.setAttribute("class", codeLanguage(n));
        copyClean(n, el);
        out.appendChild(el);
        continue;
      }
      copyClean(n, out); // всё прочее — только содержимое
    }
  }

  function load(raw) {
    // parseFromString не исполняет скрипты, а в поле попадают только узлы белого списка
    var doc = new DOMParser().parseFromString(raw, "text/html");
    copyClean(doc.body, editor);
  }

  function loadPlain(raw) {
    var lines = raw.split("\n");
    for (var i = 0; i < lines.length; i++) {
      if (i) editor.appendChild(document.createElement("br"));
      if (lines[i]) editor.appendChild(document.createTextNode(lines[i]));
    }
  }

  // --- выход: поле → Telegram HTML ---
  function serializeNode(node) {
    if (node.nodeType === 3) return esc(node.nodeValue);
    if (node.nodeType !== 1) return "";
    var tag = node.tagName;
    if (tag === "BR") return "\n";
    var inner = "";
    var kids = node.childNodes;
    for (var i = 0; i < kids.length; i++) inner += serializeNode(kids[i]);
    if (tag === "DIV" || tag === "P") return inner + "\n";
    if (tag === "A") {
      var href = node.getAttribute("href") || "";
      if (!inner || !allowedUrl(href)) return inner;
      return '<a href="' + escAttr(href.trim()) + '">' + inner + "</a>";
    }
    var keep = KEEP[tag];
    if (!keep || !inner) return inner; // пустые теги наружу не отдаём
    var open = keep;
    if (tag === "CODE" && codeLanguage(node)) {
      open += ' class="' + escAttr(codeLanguage(node)) + '"';
    }
    return "<" + open + ">" + inner + "</" + keep + ">";
  }

  function serialize() {
    var out = "";
    var kids = editor.childNodes;
    for (var i = 0; i < kids.length; i++) out += serializeNode(kids[i]);
    return out.replace(/\n+$/, ""); // contenteditable любит держать пустой <br> в конце
  }

  function plainText() {
    return editor.innerText.replace(/\n+$/, "");
  }

  function visibleLength() {
    return plainText().length;
  }

  // --- выделение: фокус уходит на кнопки панели, поэтому диапазон запоминаем ---
  var savedRange = null;

  function saveRange() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (editor.contains(range.commonAncestorContainer)) savedRange = range.cloneRange();
  }

  function restoreRange() {
    if (!savedRange) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }

  document.addEventListener("selectionchange", saveRange);

  function currentAnchor() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    var node = sel.getRangeAt(0).commonAncestorContainer;
    while (node && node !== editor) {
      if (node.nodeType === 1 && node.tagName === "A") return node;
      node = node.parentNode;
    }
    return null;
  }

  function unwrap(el) {
    while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
    el.parentNode.removeChild(el);
  }

  function exec(cmd, value) {
    editor.focus();
    restoreRange();
    document.execCommand(cmd, false, value === undefined ? null : value);
    saveRange();
    refresh();
  }

  function bindCommand(id, cmd) {
    var btn = document.getElementById(id);
    // mousedown с preventDefault: иначе клик по кнопке снимает выделение в поле
    btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
    btn.addEventListener("click", function () { exec(cmd); });
  }

  bindCommand("bold", "bold");
  bindCommand("italic", "italic");

  var clearBtn = document.getElementById("clear");
  clearBtn.addEventListener("mousedown", function (e) { e.preventDefault(); });
  clearBtn.addEventListener("click", function () {
    editor.focus();
    restoreRange();
    document.execCommand("removeFormat");
    document.execCommand("unlink");
    saveRange();
    refresh();
  });

  var linkBtn = document.getElementById("link");
  linkBtn.addEventListener("mousedown", function (e) { e.preventDefault(); });
  linkBtn.addEventListener("click", function () {
    if (linkbar.classList.contains("on")) {
      linkbar.classList.remove("on");
      return;
    }
    var anchor = currentAnchor();
    urlInput.value = anchor ? anchor.getAttribute("href") || "" : "";
    linkbar.classList.add("on");
    urlInput.focus();
  });

  document.getElementById("apply").addEventListener("mousedown", function (e) {
    e.preventDefault();
  });
  document.getElementById("apply").addEventListener("click", applyLink);
  urlInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      applyLink();
    }
  });

  function applyLink() {
    var url = urlInput.value.trim();
    editor.focus();
    restoreRange();
    var anchor = currentAnchor();
    if (!url) {
      if (anchor) unwrap(anchor);          // пустой URL — снять ссылку
      else document.execCommand("unlink");
    } else if (!allowedUrl(url)) {
      urlInput.value = "";
      urlInput.placeholder = "Нужен http(s)://, tg:// или mailto:";
      return;
    } else if (anchor) {
      anchor.setAttribute("href", url);
    } else if (window.getSelection().isCollapsed) {
      // выделения нет — вставляем сам адрес как текст ссылки
      document.execCommand(
        "insertHTML", false, '<a href="' + escAttr(url) + '">' + esc(url) + "</a>"
      );
    } else {
      document.execCommand("createLink", false, url);
    }
    linkbar.classList.remove("on");
    saveRange();
    refresh();
  }

  // --- ввод: только <br> и только plain text, чтобы сериализация была предсказуемой ---
  function insertBreak() {
    if (!document.execCommand("insertLineBreak")) {
      document.execCommand("insertHTML", false, "<br>");
    }
  }

  editor.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      insertBreak();
      refresh();
    }
  });

  editor.addEventListener("paste", function (e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
    var lines = text.split(/\r\n|\r|\n/);
    for (var i = 0; i < lines.length; i++) {
      if (i) insertBreak();
      if (lines[i]) document.execCommand("insertText", false, lines[i]);
    }
    refresh();
  });

  editor.addEventListener("input", refresh);

  // --- отправка ---
  function payload() {
    if (legacy) return JSON.stringify({ id: draftId, text: plainText() });
    return JSON.stringify({ id: draftId, html: serialize() });
  }

  function refresh() {
    var shown = visibleLength();
    var used = enc.encode(payload()).length;
    if (used > DATA_LIMIT) {
      counter.textContent = "Слишком длинно для редактора: сократи текст или ссылки";
      counter.className = "over";
    } else if (shown > TEXT_LIMIT) {
      counter.textContent = shown + " / " + TEXT_LIMIT;
      counter.className = "over";
    } else {
      counter.textContent = shown + " / " + TEXT_LIMIT;
      counter.className = "";
    }
    if (shown === 0 || shown > TEXT_LIMIT || used > DATA_LIMIT) {
      tg.MainButton.disable();
      tg.MainButton.setParams({ color: "#9e9e9e" });
    } else {
      tg.MainButton.enable();
      tg.MainButton.setParams({ color: tg.themeParams.button_color || "#2481cc" });
    }
  }

  tg.MainButton.setText("💾 Сохранить");
  tg.MainButton.show();
  tg.MainButton.onClick(function () {
    var data = payload();
    if (enc.encode(data).length > DATA_LIMIT) return;
    if (visibleLength() === 0 || visibleLength() > TEXT_LIMIT) return;
    tg.sendData(data); // отправляет боту и закрывает окно
  });

  if (legacy) {
    // старый демон сохранит только текст — кнопки форматирования были бы обманом
    document.getElementById("toolbar").style.display = "none";
    loadPlain(params.get("text") || "");
  } else {
    load(params.get("html") || "");
  }
  refresh();
  editor.focus();
})();
</script>
</body>
</html>
